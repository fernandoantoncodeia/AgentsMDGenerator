[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentsmd"
version = "0.1.0"
description = "MCP server and operator CLI for the AgentsMDGenerator prompt catalogue"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "click>=8.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.28.0",
]

[project.scripts]
agentsmd = "agentsmd.cli:main"
agentsmd-server = "agentsmd.server:main"
agentsmd-install = "agentsmd.install:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["agentsmd"]

[tool.hatch.build.targets.wheel.force-include]
"prompt-catalogue/curated" = "agentsmd/_assets/prompt-catalogue/curated"
".factory/skills/update-agents/SKILL.md" = "agentsmd/_assets/workflow/skills/update-agents/SKILL.md"
".factory/commands/update-agents.md" = "agentsmd/_assets/workflow/commands/update-agents.md"
